[project]
name = "tighten"
version = "0.1.0"
description = "Strict linters on the lines you just changed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15,<3.16"
dependencies = ["identify>=2.6.20", "psutil>=7.2.2", "pydantic>=2.14.4", "pygit2>=1.21.0"]

[project.scripts]
tighten = "tighten:main"

[dependency-groups]
dev = ["ruff>=0.17.6", "ty>=0.0.107"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["tighten/embedded/vale/styles/config"]
wheel-exclude = ["tighten/embedded/vale/styles/config"]

[tool.ruff.lint]
extend-select = ["ANN", "B", "BLE", "ASYNC", "PGH", "RUF"]
extend-ignore = ["B008", "RUF005", "RUF010", "RUF021", "RUF022", "RUF023"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
unused-awaitable = "error"
deprecated = "error"
redundant-cast = "error"
