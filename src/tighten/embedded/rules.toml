[[rules]]
id = 'new-lint-or-type-suppression'
message = 'This adds a suppression comment. Fix the finding. If the rule does not fit this repo, change it in the repo lint config instead, scoped as narrowly as possible, and say why.'
pattern = '(?i)(eslint-disable|@ts-(ignore|expect-error|nocheck)|tslint:disable|biome-ignore|stylelint-disable|(istanbul|c8|v8)\s+ignore|nosemgrep|nosec\b|#\s*noqa\b|NOSONAR|#\s*type:\s*ignore|#\s*(pyright|mypy|ty):\s*ignore|pylint:\s*disable|pragma:\s*no\s+cover|shellcheck\s+disable|zizmor:\s*ignore|yamllint\s+disable|spellchecker:\s*(off|disable|ignore)|(?<![\w])\/\/\s*nolint|@SuppressWarnings|rubocop:disable|@phpstan-ignore|(lgtm|codeql)\[|checkov:skip|tfsec:ignore|trivy:ignore|gitleaks:allow)'
exclude = ['**/*.md', '**/*.mdx', '**/*.txt', 'src/tighten/embedded/rules.toml', 'demo/demo.tape']

[[rules]]
id = 'new-focused-or-skipped-js-test'
message = 'This commit adds a focused or skipped test. Remove the modifier so the whole suite runs, or delete the test.'
pattern = '(\b(describe|it|test|context|suite|specify|bench)(\.\w+)*\.(only|skip|fixme)\b|(?<![\w.$])(fdescribe|fit|xdescribe|xit|xtest|xcontext|xspecify)\s*\()'
include = ['**/*.js', '**/*.jsx', '**/*.mjs', '**/*.cjs', '**/*.ts', '**/*.tsx', '**/*.mts', '**/*.cts']

[[rules]]
id = 'new-skipped-python-test'
message = 'This commit adds an unconditional skip or expected failure. Fix the test or delete it.'
pattern = '(pytest\.(mark\.)?(skip|xfail)\b|unittest\.(skip|expectedFailure)\b)'
include = ['**/*.py']

[[rules]]
id = 'new-disabled-jvm-or-dotnet-test'
message = 'This commit adds a disabled test. Fix the test or delete it.'
pattern = '(@(Disabled|Ignore)\b|\[Ignore\b|\[(Fact|Theory)\([^\]]*Skip\s*=)'
include = ['**/*.java', '**/*.kt', '**/*.kts', '**/*.scala', '**/*.groovy', '**/*.cs']
